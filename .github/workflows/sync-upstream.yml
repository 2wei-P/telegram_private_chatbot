name: Sync upstream

on:
  schedule:
    - cron: '0 21 * * *'        # 每天 21:00 UTC 自动跑一次（约北京时间凌晨5点）
  workflow_dispatch:            # 允许你在网页上手动点一下就跑

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # 关键：给这个工作流"可以推送代码"的权限
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 拉取完整历史，rebase 才需要

      - name: Add upstream
        run: git remote add upstream https://github.com/jikssha/telegram_private_chatbot.git

      - name: Fetch upstream
        run: git fetch upstream

      - name: Rebase main
        run: |
          git checkout main
          git rebase upstream/main

      - name: Push
        run: git push origin main
